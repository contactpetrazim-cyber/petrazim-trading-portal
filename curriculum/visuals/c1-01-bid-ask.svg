<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="700" height="320" fill="#EAEAF4"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A3364">Bid / Ask / Spread</text>

  <line x1="100" y1="160" x2="600" y2="160" stroke="#333" stroke-width="2"/>

  <circle cx="250" cy="160" r="6" fill="#15803d"/>
  <line x1="250" y1="160" x2="250" y2="220" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="250" y="240" text-anchor="middle" font-size="14" fill="#15803d" font-weight="bold">BID 1.0900</text>
  <text x="250" y="258" text-anchor="middle" font-size="11" fill="#333">what buyers pay /</text>
  <text x="250" y="272" text-anchor="middle" font-size="11" fill="#333">where you SELL</text>

  <circle cx="450" cy="160" r="6" fill="#b91c1c"/>
  <line x1="450" y1="160" x2="450" y2="220" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="450" y="240" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="bold">ASK 1.0902</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#333">what sellers accept /</text>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#333">where you BUY</text>

  <path d="M250,120 L250,105 L450,105 L450,120" fill="none" stroke="#FF7A00" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" font-size="13" fill="#FF7A00" font-weight="bold">SPREAD = 2 pips (real cost)</text>

  <rect x="130" y="285" width="440" height="28" rx="6" fill="#FFF3E0" stroke="#FF7A00"/>
  <text x="350" y="303" text-anchor="middle" font-size="12" fill="#7a3e00">
    Buy now at ASK, sell now at BID — you are down the spread instantly, before price moves.
  </text>
</svg>
