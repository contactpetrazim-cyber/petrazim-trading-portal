name: Weekly quiz broadcast

# Same free-scheduler approach as daily-community-broadcast.yml — see
# that workflow's comment for why GitHub Actions instead of a Render
# Cron Job, and the CRON_SECRET repository-secret setup it needs.

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch: {}

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: POST /community/broadcast/weekly-quiz
        run: |
          # See daily-community-broadcast.yml's step for why: retry
          # through a Render cold start, and print status + body instead
          # of swallowing it, so a failure here is actually diagnosable.
          http_code=$(curl -sS -X POST \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 45 \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -o response.json -w '%{http_code}' \
            https://petrazim-trading-backend.onrender.com/community/broadcast/weekly-quiz)
          echo "HTTP $http_code"
          cat response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::weekly-quiz broadcast returned HTTP $http_code"
            exit 1
          fi
          # Same gap as daily-community-broadcast.yml: a 200 OK only means
          # the request was accepted, not that anything reached Telegram —
          # fail the workflow honestly when every channel's send failed.
          sent=$(jq -r '.sent // false' response.json)
          if [ "$sent" != "true" ]; then
            echo "::error::weekly-quiz broadcast returned HTTP $http_code but sent=false — zero channels actually delivered (see channels_failed above). Check TELEGRAM_BOT_TOKEN_INDIVIDUAL / TELEGRAM_BOT_TOKEN_CORP on the Render backend."
            exit 1
          fi
