name: Daily community broadcast

# Free scheduler for the daily tip + leaderboard broadcast (see
# backend/app/routers/community_broadcast.py) — chosen over a Render
# Cron Job specifically because that would be a new billed resource;
# GitHub Actions is free on this public repo. Needs a repository
# secret named CRON_SECRET (Settings -> Secrets and variables ->
# Actions -> New repository secret) matching the CRON_SECRET already
# set on the Render backend — this workflow can't set that secret
# itself, someone with repo admin access has to add it once.

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab, for testing

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: POST /community/broadcast/daily-tip
        run: |
          # --retry rides out a Render free-tier cold start (the backend
          # sleeps after ~15 idle minutes; a single-shot request that
          # lands mid-wake used to just fail outright — this is the same
          # "actively wait for a cold backend" fix already applied to
          # order placement in the app itself). -w prints the HTTP status
          # and -o keeps the body so a non-2xx or a silent zero-channel
          # send (see community_broadcast.py's channels_sent/
          # channels_failed) is visible in the run log instead of just
          # "step failed, no further detail" — a plain `curl -sf` used to
          # swallow the response body entirely, so a real failure here
          # was previously impossible to diagnose from the log alone.
          http_code=$(curl -sS -X POST \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 45 \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -o response.json -w '%{http_code}' \
            https://petrazim-trading-backend.onrender.com/community/broadcast/daily-tip)
          echo "HTTP $http_code"
          cat response.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::daily-tip broadcast returned HTTP $http_code"
            exit 1
          fi
