name: Keep Supabase project active

# Supabase's free tier pauses a project after 7 days with no API/DB
# activity — a real, separate issue from Render's 15-minute backend
# sleep above. Pausing doesn't delete data, but it does mean the next
# real request has to wait for someone to manually un-pause it from the
# Supabase dashboard, which isn't automatic the way Render's wake-on-
# request is. Running this once a day keeps it comfortably inside that
# 7-day window forever, for free, with no dashboard clicking needed.
#
# Setup (one-time): Settings -> Secrets and variables -> Actions -> New
# repository secret, twice:
#   SUPABASE_URL          e.g. https://xxxxx.supabase.co
#   SUPABASE_ANON_KEY      the project's anon/public API key
# Both are on the Supabase dashboard under Project Settings -> API.
on:
  schedule:
    - cron: '0 6 * * *'   # once a day, 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (this app's own project)
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets not set yet — add them in repo Settings > Secrets and variables > Actions once the Supabase project exists. Skipping."
            exit 0
          fi
          # /rest/v1/ (PostgREST root) rejects the anon key with 401 —
          # it's restricted to the service_role key, confirmed live.
          # /auth/v1/health is the right target: public, works with the
          # anon key, returns 200, and still counts as real project
          # activity for Supabase's own inactivity tracking.
          curl -sf --max-time 25 "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            && echo "Supabase responded — project active." \
            || echo "No response — check the project isn't already paused (Supabase dashboard shows this, and a paused project needs one manual un-pause click to recover, this workflow can't do that part)."

      # Second, unrelated project — "Petrazim Training" (a separate
      # Supabase project, ehfnoktatbbucvpnkyty, that got its own "7 days
      # no activity" pause warning by direct report). Piggybacking on
      # this same daily workflow rather than a whole second file: same
      # mechanism, same schedule, nothing about it needs to run on a
      # different cadence. URL is hardcoded (Supabase project URLs
      # aren't secret, only the key is) — fetched directly via the
      # Supabase MCP, no need to look it up manually. The anon key
      # couldn't be fetched the same way (the project was already
      # dormant when asked), so that one still needs the one-time manual
      # paste this whole file's setup comment already describes.
      - name: Ping Supabase REST API (Petrazim Training project)
        run: |
          if [ -z "${{ secrets.TRAINING_SUPABASE_ANON_KEY }}" ]; then
            echo "TRAINING_SUPABASE_ANON_KEY secret not set yet — add it in repo Settings > Secrets and variables > Actions (Project Settings > API on https://supabase.com/dashboard/project/ehfnoktatbbucvpnkyty). Skipping."
            exit 0
          fi
          curl -sf --max-time 25 "https://ehfnoktatbbucvpnkyty.supabase.co/auth/v1/health" \
            -H "apikey: ${{ secrets.TRAINING_SUPABASE_ANON_KEY }}" \
            && echo "Training Supabase project responded — active." \
            || echo "No response — if this project was already paused before the key was added, a paused project needs one manual un-pause click from the dashboard first; this workflow can't do that part."
