
[build]
  base = "frontend"
  publish = "frontend/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://your-backend-url.onrender.com"
  VITE_WS_URL = "wss://your-backend-url.onrender.com/ws"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
