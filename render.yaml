
services:
  - type: web
    name: smc-trading-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smc-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: smc-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free

  - type: redis
    name: smc-redis
    plan: free
    ipAllowList: []

databases:
  - name: smc-postgres
    plan: free
    databaseName: smc_trading
    user: smc
